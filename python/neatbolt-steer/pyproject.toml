[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "neatbolt-steer"
version = "0.1.0"
description = "Steering hook for Neatlogs Bolt: adds Bolt' guidance notes to your agent's next LLM call and gives it a check_my_work tool."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []
keywords = ["agents", "llm", "observability", "neatlogs", "neatbolt", "opentelemetry"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/neatlogs/neatlogs-bolt"

[tool.hatch.build.targets.wheel]
packages = ["src/neatbolt_steer"]
