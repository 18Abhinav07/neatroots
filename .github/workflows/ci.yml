name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python steering hook
        run: |
          python -m pip install -e "python/neatroots-steer[test]"
          python -m pytest python/neatroots-steer -q
      - name: Installer, from a freshly packaged bundle
        run: |
          sh -n install.sh
          node scripts/package.mjs
          NEATROOTS_INSTALL_DIR="$RUNNER_TEMP/nb" NEATROOTS_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh --bundle release/neatroots.tar.gz --no-connect --no-modify-path
          "$RUNNER_TEMP/bin/neatroots" --version
          "$RUNNER_TEMP/bin/neatroots" connect --list
